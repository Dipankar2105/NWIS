services:
  - type: web
    name: nwis-backend
    env: python
    region: singapore
    plan: free
    rootDir: NWIS_Integrated_Backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_NAME
        value: NWIS
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: API_PREFIX
        value: /api/v1
      - key: PORT
        value: "8000"
      - key: SUPABASE_URL
        value: https://seyocourjkgjjzlropgz.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://*.vercel.app,http://localhost:5173,http://localhost:3000
      - key: UPLOAD_DIR
        value: ./uploads
